[project]
name = "trg"
version = "1.0.0"
description = "A temporal knowledge graph for third-party risk: entity resolution, extraction, agentic enrichment and natural-language questions in Cypher, measured against a simulated world"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "pydantic>=2.6", "kuzu==0.11.3", "rapidfuzz>=3.0", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
live = ["anthropic>=0.40"]
neo4j = ["neo4j>=5.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "E731", "SIM102", "SIM108", "B905", "SIM210"]

[tool.ruff.lint.per-file-ignores]
"src/trg/world/*" = ["E501", "RUF007", "RUF015"]

[tool.ruff.format]
exclude = ["src/trg/world/*"]
